jobs:
  seed_testdata:
    name: seed_testdata
    schedule:
      cron: 0 6 * * MON
      paused: true
      timezone: Europe/Amsterdam
    tags:
      layer: all
      purpose: migration-test
    tasks:
    - action: notebook.run_all
      path: seed_testdata/src/silver/order_lines
      task_key: silver_order_lines
    - action: notebook.run_all
      depends_on:
      - task_key: silver_order_lines
      path: seed_testdata/src/gold/marts
      task_key: gold_marts
    timeout_seconds: 3600
  taxi_spark:
    name: taxi_spark
    schedule:
      cron: 0 0 * * *
      paused: true
    tags:
      compute: classic
      purpose: migration-test
    tasks:
    - action: python.run
      args:
      - --catalog
      - playground3
      - --schema
      - pg3_silver__taxi_spark
      depends_on:
      - task_key: trip_features
      - task_key: shipping_priority
      parameters:
        engine: spark
      path: taxi_spark/src/optimize.py
      task_key: optimize
    - action: python.run
      args:
      - --catalog
      - playground3
      - --schema
      - pg3_silver__taxi_spark
      parameters:
        engine: spark
      path: taxi_spark/src/shipping_priority.py
      task_key: shipping_priority
    - action: python.run
      args:
      - --catalog
      - playground3
      - --schema
      - pg3_silver__taxi_spark
      parameters:
        engine: spark
      path: taxi_spark/src/trip_features.py
      task_key: trip_features
